# SoluPlay — the build gate.
#
# What this does: on every push and pull request it runs the four checks that
# the audit found missing (P14.11) — the project's type check, its lint, the
# compiled test suite, and a static check that this file and package.json have
# not quietly stopped agreeing with each other.
#
# The gate has no environment. It holds no secret, no token and no address, it
# never deploys, and it never talks to the production database or the stream
# box, so a red run here cannot touch anything live. The suite's own
# "test:premium-box" script is deliberately NOT part of this workflow: it needs
# the private ProxyServer checkout, which this public repository cannot clone.
# It stays a local command. scripts/verify-ci-gate.mjs asserts that exclusion.
#
# Acceptance for P14.11 is a RED run on an introduced type error: the type
# check below must fail the job when a file does not compile.

name: SoluPlay CI gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One gate per ref. A new push supersedes the run it started — unlike the health
# pass, this job only reads the repository, so cancelling loses nothing.
concurrency:
  group: soluplay-ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the gate itself
        run: npm run check:ci-gate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all
