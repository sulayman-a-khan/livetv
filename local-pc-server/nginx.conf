# ============================================================================
#  Sample nginx.conf for the local PC (nginx + nginx-rtmp-module)
#
#  Flow:
#    OBS / FFmpeg --RTMP--> nginx :1935 --writes HLS--> /hls/<name>.m3u8 + segments
#    Browser/app --HTTPS--> your domain/tunnel --> nginx :8080
#         /hls/   served straight from disk (local HLS segments, CORS enabled)
#         /live/  proxied to local-pc-server's PUBLIC port (5001): rewritten
#                 playlists, custom headers, origin protection
#
#  In the admin UI use the encoder URL:  http://127.0.0.1:8080/hls/match1.m3u8
#  (the forwarder fetches that; viewers only ever see /live/<streamId>.m3u8)
#
#  Windows: use forward slashes, e.g.  hls_path C:/nginx/html/hls;  root C:/nginx/html;
#  Linux:   hls_path /var/www/hls;                                  root /var/www;
#
#  OBS:    Settings > Stream > Custom, Server rtmp://127.0.0.1/live, Stream key match1
#  FFmpeg: ffmpeg -re -i input.mp4 -c:v libx264 -preset veryfast -g 60 -c:a aac \
#            -f flv rtmp://127.0.0.1/live/match1
#
#  Needs nginx built with nginx-rtmp-module (Linux: libnginx-mod-rtmp;
#  Windows: a prebuilt nginx-rtmp-win32 package).
# ============================================================================

worker_processes auto;
events { worker_connections 4096; }

# ---------------------------------------------------------------------------
# RTMP ingest -> HLS
# ---------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Only accept publishing from this PC (OBS/FFmpeg on localhost).
        allow publish 127.0.0.1;
        deny publish all;

        application live {
            live on;
            record off;

            hls on;
            hls_path /var/www/hls;          # Windows: C:/nginx/html/hls
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_cleanup on;
            hls_nested off;                 # files: hls/<key>.m3u8, hls/<key>-<n>.ts
        }
    }
}

# ---------------------------------------------------------------------------
# HTTP: serve HLS + front the forwarder
# ---------------------------------------------------------------------------
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Allowed browser origins -> value echoed in Access-Control-Allow-Origin.
    # Replace with your real site(s); "*" is fine for fully public streams.
    map $http_origin $cors_origin {
        default                         "";
        "~^https://tv\.example\.com$"   $http_origin;
        "~^https://www\.example\.com$"  $http_origin;
        # "~.*"                         "*";     # uncomment to allow any origin
    }

    server {
        listen 8080;
        server_name _;

        # ---- local HLS files, straight from disk --------------------------
        location /hls/ {
            root /var/www;                  # Windows: C:/nginx/html  (so /hls/ maps to C:/nginx/html/hls/)

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }

            # CORS (also on error responses, hence "always")
            add_header Access-Control-Allow-Origin   $cors_origin always;
            add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers  "Range, Content-Type, Origin, Accept" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type" always;
            add_header Vary                          Origin always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, Content-Type, Origin, Accept" always;
                add_header Access-Control-Max-Age       86400 always;
                add_header Content-Length 0;
                return 204;
            }

            # Live playlists must never be cached; finished segments may be.
            location ~ \.m3u8$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type" always;
                add_header Vary Origin always;
            }
            location ~ \.ts$ {
                add_header Cache-Control "public, max-age=30" always;
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type" always;
                add_header Vary Origin always;
            }

            # No directory listing, no hidden files.
            autoindex off;
        }

        # ---- the forwarder (rewritten playlists, custom headers) ----------
        # Proxy to the PUBLIC listener (PUBLIC_PORT=5001), never to the admin port.
        location /live/ {
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream segments through without buffering to disk.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 60s;

            # The forwarder already sends CORS headers; hide them so the browser
            # does not receive duplicates (duplicate Access-Control-Allow-Origin
            # values make browsers reject the response). Nginx's value wins.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            add_header Access-Control-Allow-Origin   $cors_origin always;
            add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers  "Range, Content-Type, Origin, Accept" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, Accept-Ranges" always;
            add_header Vary                          Origin always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, Content-Type, Origin, Accept" always;
                add_header Access-Control-Max-Age       86400 always;
                add_header Content-Length 0;
                return 204;
            }
        }

        # Everything else (including the admin UI) is NOT exposed.
        location / {
            return 404;
        }
    }
}
