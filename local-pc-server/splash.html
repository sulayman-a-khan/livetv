<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoluPlay • Origin Control Server</title>
<style>
  :root {
    --bg: #090d16;
    --surface: #0f172a;
    --border: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --primary: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 50% 30%, rgba(59, 130, 246, 0.12), transparent 70%),
      radial-gradient(500px 350px at 60% 80%, rgba(16, 185, 129, 0.07), transparent 70%);
    pointer-events: none;
  }
  .card {
    position: relative;
    width: 420px;
    padding: 40px 36px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .orb {
    width: 64px;
    height: 64px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 3px solid rgba(59, 130, 246, 0.18);
    border-top-color: var(--primary);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin-bottom: 10px;
  }
  h1 span { color: var(--primary); }
  #status {
    min-height: 40px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .url {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="orb"></div>
    <h1>SoluPlay <span>•</span> Origin Control Server</h1>
    <p id="status">Starting local server…</p>
    <div class="url">http://localhost:5000</div>
  </div>
  <script>
    window.setStatus = function (text) {
      var el = document.getElementById("status");
      if (el && text) el.textContent = text;
    };
    try {
      var initial = new URLSearchParams(location.search).get("s");
      if (initial) window.setStatus(initial);
    } catch (e) {}
  </script>
</body>
</html>
